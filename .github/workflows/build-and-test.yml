name: Build and Test API

# Run on every push and on every pull request to main
on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Download the NuGet packages
      - name: Restore packages
        run: dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      # 4. Build the API (the test project builds it too)
      - name: Build API
        run: dotnet build RaceDay.Api/RaceDay.Api.csproj --no-restore --configuration Release

      # 5. Build the tests
      - name: Build tests
        run: dotnet build RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-restore --configuration Release

      # 6. Run all the unit tests. If one fails, the build turns red.
      - name: Run unit tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-build --configuration Release --verbosity normal
