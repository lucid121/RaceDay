namname: Build and Test System

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore RaceDay.Api/RaceDay.Api.csproj
          dotnet restore RaceDay.Web/RaceDay.Web.csproj
          dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build Projects
        run: |
          dotnet build RaceDay.Api/RaceDay.Api.csproj --no-restore --configuration Release
          dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release
          dotnet build RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-build --configuration Release --verbosity normal
