name: Validate Documentation

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if docs folder exists
        run: |
          if [ -d "docs" ]; then
            echo "✅ /docs folder found successfully."
          else
            echo "❌ Error: /docs folder is missing!"
            exit 1
          fi

      - name: Verify Required Planning Files
        run: |
          echo "Checking required files inside /docs..."
          shopt -s nullglob
          
          # Check ERD (Accepting common image/pdf formats)
          ERD_FILES=(docs/*.jpg docs/*.png docs/*.pdf docs/*.JPG docs/*.PNG docs/*.PDF)
          if [ ${#ERD_FILES[@]} -gt 0 ]; then
            echo "✅ ERD planning document found."
          else
            echo "❌ Error: Missing ERD image or PDF in /docs!"
            exit 1
          fi
          
          # Check SQL Script
          SQL_FILES=(docs/*.sql docs/*.SQL)
          if [ ${#SQL_FILES[@]} -gt 0 ]; then
            echo "✅ SQL Database Script found."
          else
            echo "❌ Error: Missing .sql script file in /docs!"
            exit 1
          fi
          
          echo "🎉 All Part 1 documentation requirements successfully validated!"
